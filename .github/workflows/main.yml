name: Enterprise Multi Environment Deployment

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: python-app

jobs:

  build:

    name: Build Test Sonar Build Docker Push
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Unit Tests
        run: |
          coverage run -m unittest discover -s tests
          coverage xml

      - name: Generate Image Tag
        id: tag
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  deploy:

    name: Deploy
    needs: build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - DEV
          - QA
          - PROD

    environment: ${{ matrix.environment }}

    steps:

      - name: Deploy to ${{ matrix.environment }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            IMAGE=${{ secrets.DOCKER_USERNAME }}/python-app:${{ needs.build.outputs.image_tag }}

            docker pull $IMAGE

            docker stop python-app || true

            docker rm python-app || true

            docker run -d \
              --name python-app \
              --restart always \
              --env-file ${{ secrets.ENV_FILE_PATH }} \
              -p 5000:5000 \
              $IMAGE
